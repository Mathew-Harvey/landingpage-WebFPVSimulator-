<!doctype html><html><head><meta charset="utf-8"><title>city lab 2</title>
<style>html,body{margin:0;height:100%;background:#7a4e5e}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
const P = new URLSearchParams(location.search);
const num = (k,d)=>{const v=parseFloat(P.get(k));return Number.isFinite(v)?v:d;};
const rig = P.get('rig') || 'page';

const { buildWorld } = await import('./src/city/vendored/world/index.js');
const { PAL } = await import('./src/city/vendored/core/palette.js');
const { bakeCity, thinFoliage, chunkInstanced } = await import('./src/city/bake.js');

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(innerWidth, innerHeight, false);
renderer.setPixelRatio(1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.2, 1200);
const g = new THREE.Group(); scene.add(g);
const world = buildWorld(g, { bake:false });
bakeCity(world, { cell: Infinity, shadowCell: 80, cullCell: 40, casterMinRadius: 1e9, casterMinRadiusInstanced: 1e9, releaseStillRigs: true, shadowProxyCell: 0 });
thinFoliage(world.root, { keep: 0.72 });
chunkInstanced(world.root, { cell: 40 });

const target = new THREE.Object3D(); scene.add(target);
target.position.set(0, 2, 0);
if (rig === 'town') {
  /* The simulator's own city rig, verbatim from src/maps/city/index.js */
  scene.fog = new THREE.Fog(PAL.fog, 40, 300);
  renderer.setClearColor(PAL.fog, 1);
  const sun = new THREE.DirectionalLight(PAL.sun, 2.25);
  sun.position.set(-52, 62, 56); scene.add(sun); scene.add(sun.target);
  const fill = new THREE.DirectionalLight(PAL.fill, 1.08);
  fill.position.set(48, 26, -44); scene.add(fill); scene.add(fill.target);
  const bounce = new THREE.DirectionalLight(0xd8cbe8, 0.34);
  bounce.position.set(10, -18, 40); scene.add(bounce); scene.add(bounce.target);
  scene.add(new THREE.HemisphereLight(PAL.hemiSky, PAL.hemiGround, 1.12));
} else {
  /* The landing page's world rig, as stage.js sets it at world = 1 */
  const HORIZON = new THREE.Color(0xdf9d94), STUDIO = new THREE.Color(0x7a4e5e);
  const fog = STUDIO.clone().lerp(HORIZON, 0.92);
  scene.fog = new THREE.Fog(fog, 60, 620);
  renderer.setClearColor(fog, 1);
  const key = new THREE.DirectionalLight(new THREE.Color(0xfff0d8).lerp(new THREE.Color(0xffcfb4),1), 3.25-1.75);
  key.position.set(0.42*100, 0.70*100, 0.55*100); scene.add(key); scene.add(key.target);
  const rim = new THREE.DirectionalLight(0xf0aec0, 2.15*(1-0.86)); rim.position.set(-70,28,-62); scene.add(rim);
  const kick = new THREE.DirectionalLight(0xe6d4dc, 1.55*(1-0.78)); kick.position.set(25,82,-72); scene.add(kick);
  const hemi = new THREE.HemisphereLight(0x9ec4e8, 0x3f5b3a, 0.95+0.28); scene.add(hemi);
}

/* What the town's own terrain actually covers, so the page's deck can be
   cut out from under it. */
{
  const bb = new THREE.Box3(); const one = new THREE.Box3();
  const named = [];
  world.root.traverse(o => {
    if (!o.isMesh) return;
    const n = (o.name || '') + '|' + (o.parent && o.parent.name || '');
    if (/ground|land|terrain|hill|turf|grass|lake|road|street|pad/i.test(n)) {
      one.setFromObject(o); if (!one.isEmpty()) { bb.union(one); named.push([n, one.min.x.toFixed(0), one.max.x.toFixed(0), one.min.z.toFixed(0), one.max.z.toFixed(0)]); }
    }
  });
  const all = new THREE.Box3().setFromObject(world.root);
  window.__ground = { terrain: { min: bb.min.toArray().map(v=>+v.toFixed(1)), max: bb.max.toArray().map(v=>+v.toFixed(1)) },
    all: { min: all.min.toArray().map(v=>+v.toFixed(1)), max: all.max.toArray().map(v=>+v.toFixed(1)) },
    sample: named.slice(0, 14) };
}
const eye = new THREE.Vector3(num('ex',60), num('ey',48), num('ez',96));
const at = new THREE.Vector3(num('ax',0), num('ay',4), num('az',-6));
camera.position.copy(eye); camera.lookAt(at);
camera.fov = num('fov', 50); camera.updateProjectionMatrix();
renderer.render(scene, camera);
window.__ready = true;
</script></body></html>
