<!doctype html>
<!--
  The FPV wiki. A document on the landing site, not a screen inside the
  simulator. Same chrome as the film at /, no canvas of its own, no physics.

  Deep links are #wiki/<id>. The catalog in src/fc is a snapshot of the
  simulator's catalog; if they disagree, the simulator wins.

  Layout note. This page used to position the header, the panes and the
  footer independently, which meant the footer printed on top of whatever
  the reader had scrolled to. It is one grid now: header, body, footer, in
  three rows of the viewport, and only the two panes inside the body scroll.
  Nothing overlaps because nothing is free to.

  Reduced motion is honoured in two places that have to agree: the block at
  the foot of this stylesheet and REDUCED in src/wiki/anim.js. A figure that
  would have animated holds its most informative frame, and every control on
  it still works, because the control is where the meaning is.

  This file is part of the WebFPVSimulator landing page.

  the Free Software Foundation, either version 3 of the License, or (at
  your option) any later version.

  This program is distributed in the hope that it will be useful, but
  WITHOUT ANY WARRANTY; without even the implied warranty of
  MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the GNU
  General Public License for more details.

  You should have received a copy of the GNU General Public License
  along with this program. If not, see <https://www.gnu.org/licenses/>.

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FPV wiki, WebFPV</title>
    <meta
      name="description"
      content="How a racing quad actually flies, and how this simulator computes it. Thirty five illustrated pages plus every Betaflight 4.5.1 setting, with figures you can drive."
    />
    <meta name="theme-color" content="#141c16" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23141c16'/%3E%3Cpath d='M9 9h5v5H9zM18 9h5v5h-5zM9 18h5v5H9zM18 18h5v5H9z' fill='%23e8a8b8'/%3E%3C/svg%3E" />
    <style>
      :root {
        --cream: #f3ead4;
        --sakura: #e8a8b8;
        --amber: #ffd45c;
        --mint: #7dffb4;
        --slate: #9db3c8;
        --dim: #8a9a86;
        --deep: #141c16;
        --ink: #0c120e;
        --line: rgba(244, 236, 214, 0.12);
        --line-2: rgba(244, 236, 214, 0.06);
        --edge: rgba(232, 168, 184, 0.28);
        --panel-fill: rgba(16, 22, 17, 0.88);
        --ui-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --track-eyebrow: 0.28em;
        --track-label: 0.16em;
        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
        --gutter: clamp(20px, 5vw, 72px);
        --rail: clamp(14em, 21vw, 20em);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: radial-gradient(120% 90% at 50% 6%, #1e2a20, #101610 60%) fixed;
        color: var(--cream);
        font-family: var(--ui-font);
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
      }

      /*
       * Three rows: the header, the body, the footer. The body is the only
       * one that is allowed to be short of space, and the two panes inside
       * it are the only things that scroll. svh rather than vh so an iOS
       * URL bar sliding away does not resize the whole document.
       */
      body {
        height: 100svh;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        overflow: hidden;
      }

      a { color: inherit; }
      button { font-family: inherit; }
      ::selection { background: rgba(232, 168, 184, 0.28); }

      .chequer {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 30;
        height: 5px;
        background: repeating-linear-gradient(90deg, #23272f 0 14px, #eae6dd 14px 28px);
        opacity: 0.9;
        pointer-events: none;
      }

      #topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 20px var(--gutter) 12px;
        border-bottom: 1px solid var(--line-2);
      }

      .mark {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.18em;
        color: var(--cream);
        text-decoration: none;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
      }
      .mark .fpv { color: var(--sakura); }

      .nav { display: flex; align-items: center; gap: 4px; }
      .nav a {
        padding: 8px 13px;
        border-radius: 3px;
        font-size: 12px;
        letter-spacing: var(--track-label);
        text-transform: uppercase;
        color: rgba(243, 234, 212, 0.72);
        text-decoration: none;
        transition: color 0.18s var(--ease), background 0.18s var(--ease);
      }
      .nav a:hover { color: var(--cream); background: rgba(243, 234, 212, 0.07); }
      .nav a.is-current { color: var(--cream); box-shadow: inset 0 -2px 0 var(--sakura); }
      .nav a.is-primary { color: var(--deep); background: var(--mint); font-weight: 700; }
      .nav a.is-primary:hover { background: #9dffc7; color: var(--deep); }
      @media (max-width: 760px) {
        .nav a:not(.is-primary) { display: none; }
        #topbar { padding: 16px var(--gutter) 10px; }
      }

      #wiki { min-height: 0; }

      .wiki-host { display: block; height: 100%; min-height: 0; }
      .wiki-shell {
        display: grid;
        grid-template-columns: var(--rail) minmax(0, 1fr);
        height: 100%;
        min-height: 0;
      }

      /* ---- The rail ---- */

      .wiki-rail {
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 20px 12px 32px var(--gutter);
        border-right: 1px solid var(--line);
        background: rgba(12, 18, 14, 0.5);
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 168, 184, 0.4) transparent;
      }
      .wiki-rail-head { margin-bottom: 22px; }
      .wiki-rail-block { margin-bottom: 22px; }
      .wiki-rail-kicker {
        font-size: 10.5px; font-weight: 700; letter-spacing: 0.16em;
        text-transform: uppercase; color: var(--sakura); margin-bottom: 6px;
      }
      .wiki-rail-note {
        margin: 0 0 10px; color: var(--slate); font-size: 12px; line-height: 1.45;
        max-width: 26em;
      }
      .wiki-progress {
        height: 3px; border-radius: 2px; overflow: hidden;
        background: rgba(244, 236, 214, 0.1); margin-bottom: 6px;
      }
      .wiki-progress-fill {
        height: 100%; background: var(--sakura);
        transition: width 0.35s var(--ease);
      }
      .wiki-progress-label { font-size: 11px; color: var(--slate); }

      .wiki-rail-link {
        display: flex; align-items: baseline; gap: 8px;
        width: 100%; appearance: none; border: 0; background: transparent;
        color: rgba(238, 232, 216, 0.76); font: inherit;
        font-size: 13px; line-height: 1.35; text-align: left;
        padding: 6px 10px 6px 11px;
        border-left: 3px solid transparent; cursor: pointer;
        border-radius: 0 3px 3px 0;
        transition: color 0.14s var(--ease), background 0.14s var(--ease);
      }
      .wiki-rail-link:hover { color: var(--cream); background: rgba(232, 168, 184, 0.08); }
      .wiki-rail-link.on {
        color: var(--cream); border-left-color: var(--sakura);
        background: linear-gradient(90deg, rgba(232, 168, 184, 0.15), rgba(232, 168, 184, 0) 70%);
        font-weight: 650;
      }
      /* A page on the reading path carries its step number rather than
         being listed a second time in a block of its own. */
      .wiki-rail-step {
        flex: 0 0 auto;
        min-width: 17px; height: 17px; padding: 0 3px;
        border-radius: 3px;
        background: rgba(232, 168, 184, 0.16);
        color: var(--sakura);
        font-size: 10px; font-weight: 700; line-height: 17px; text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .wiki-rail-link.on .wiki-rail-step { background: var(--sakura); color: var(--ink); }
      .wiki-rail-link:not(.is-path) { padding-left: 36px; }
      .wiki-rail-subs { margin-top: 2px; }
      .wiki-rail-sub { font-size: 12px; color: var(--slate); padding-left: 36px !important; }
      .wiki-rail-toggle { display: none; }

      /* ---- The article pane ---- */

      .wiki-main {
        overflow-y: auto; overscroll-behavior: contain; min-width: 0;
        padding: 18px var(--gutter) 64px 30px;
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 168, 184, 0.4) transparent;
        scroll-behavior: smooth;
      }
      .wiki-tools {
        position: sticky; top: -18px; z-index: 5;
        display: flex; align-items: center; gap: 10px;
        margin: 0 0 18px; padding: 12px 0 10px;
        background: linear-gradient(#131b15 72%, rgba(19, 27, 21, 0));
      }
      .wiki-search {
        flex: 1 1 auto; min-width: 0; max-width: 44em;
        padding: 10px 13px; border-radius: 4px;
        border: 1px solid rgba(244, 236, 214, 0.16);
        background: rgba(10, 15, 11, 0.75); color: var(--cream);
        font: inherit; font-size: 15px;
      }
      .wiki-search::placeholder { color: rgba(157, 179, 200, 0.6); }
      .wiki-search:focus { outline: none; border-color: var(--sakura); }
      .wiki-search-hint {
        flex: 0 0 auto;
        padding: 3px 8px; border-radius: 3px; font-family: var(--mono); font-size: 11px;
        color: var(--slate); background: rgba(244, 236, 214, 0.06);
        border: 1px solid var(--line-2);
      }
      .wiki-search:focus + .wiki-search-hint { opacity: 0; }

      .wiki-results { display: flex; flex-direction: column; gap: 5px; max-width: 62em; }
      .wiki-results[hidden], .wiki-article[hidden] { display: none !important; }
      .wiki-results-cap {
        color: var(--slate); font-size: 11.5px; letter-spacing: 0.08em;
        text-transform: uppercase; margin: 0 0 4px;
      }
      .wiki-hit {
        display: flex; flex-direction: column; gap: 4px;
        appearance: none; border: 0; border-radius: 4px;
        background: rgba(16, 22, 17, 0.55); color: var(--cream);
        font: inherit; text-align: left; padding: 10px 13px; cursor: pointer;
        box-shadow: inset 0 0 0 1px var(--line-2);
      }
      .wiki-hit:hover { background: rgba(232, 168, 184, 0.12); }
      .wiki-hit-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .wiki-hit-title { font-weight: 650; }
      .wiki-hit-snip {
        color: rgba(157, 179, 200, 0.85); font-size: 12px; line-height: 1.45;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .wiki-hit mark { background: rgba(255, 212, 92, 0.26); color: var(--amber); border-radius: 2px; }
      .wiki-hit-id, .wiki-cli-key { font-family: var(--mono); font-size: 12px; color: var(--slate); }
      .wiki-cli-key { color: var(--cream); font-size: 13px; }
      .wiki-cli-row {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        appearance: none; border: 0; border-radius: 3px;
        background: rgba(16, 22, 17, 0.5); color: var(--cream);
        font: inherit; text-align: left; padding: 8px 12px; cursor: pointer;
      }
      .wiki-cli-row:hover { background: rgba(232, 168, 184, 0.12); }

      .wiki-article { max-width: 74em; }
      .wiki-kicker {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        font-size: 10.5px; font-weight: 700; letter-spacing: 0.16em;
        text-transform: uppercase; color: var(--sakura); margin-bottom: 10px;
      }
      .wiki-step-tag {
        color: var(--slate); letter-spacing: 0.1em; font-weight: 600;
        padding-left: 10px; border-left: 1px solid var(--line);
      }
      .wiki-article h2 {
        margin: 0 0 12px; font-size: clamp(28px, 3.4vw, 44px);
        font-weight: 750; letter-spacing: -0.01em; line-height: 1.05;
        color: var(--cream);
      }
      .wiki-key { margin: 0 0 12px; }
      .wiki-key code {
        font-family: var(--mono); font-size: 14px; color: var(--amber);
        background: rgba(16, 22, 17, 0.6); padding: 3px 8px; border-radius: 3px;
      }
      /*
       * p.wiki-lede, not .wiki-lede: `.wiki-article p` is 0,1,1 and was
       * quietly winning every one of these declarations, so the deck had
       * been rendering at body size and the page had no middle voice at all.
       */
      .wiki-article p.wiki-lede {
        max-width: 44ch;
        margin: 0 0 26px;
        color: rgba(243, 237, 221, 0.94);
        font-size: clamp(17px, 1.6vw, 20px);
        line-height: 1.5;
        font-weight: 350;
        letter-spacing: -0.005em;
      }

      /* ---- Figures ---- */

      .wiki-figure {
        margin: 0 0 26px; padding: 14px 16px 12px;
        background: rgba(12, 17, 13, 0.62); border-radius: 5px;
        border-top: 2px solid rgba(232, 168, 184, 0.38);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.07);
        max-width: 62em;
      }
      .wiki-fig-eyebrow {
        font-size: 10px; font-weight: 700; letter-spacing: 0.18em;
        text-transform: uppercase; color: var(--sakura); margin-bottom: 8px;
      }
      /*
       * The aspect ratio belongs on the canvas, not on the box around it.
       * It used to be on the stage, so when the narrow-width rule forced the
       * canvas to a legible 540px the stage kept sizing itself to the much
       * smaller container and clipped roughly a third off the bottom of every
       * figure on a phone. The stage is now height-auto and only ever scrolls
       * sideways.
       */
      .wiki-fig-stage { width: 100%; overflow-y: visible; }
      .wiki-fig-canvas { display: block; width: 100%; height: auto; }
      /*
       * A figure is drawn for a wide frame and its labels are sized for one.
       * Squeezing that into a phone makes every number in it unreadable, so
       * below the breakpoint the figure keeps a legible width and the reader
       * pans it instead. The page body still never scrolls sideways.
       */
      @media (max-width: 700px) {
        .wiki-fig-stage {
          overflow-x: auto;
          overflow-y: visible;
          overscroll-behavior-x: contain;
          scrollbar-width: thin;
          scrollbar-color: rgba(232, 168, 184, 0.4) transparent;
        }
        .wiki-fig-canvas { min-width: 540px; }
      }
      /* The hint is a sibling of the stage, not an ::after inside a scroll
         container, where it was laid out off the right edge and never seen. */
      .wiki-fig-hint { display: none; }
      @media (max-width: 700px) {
        .wiki-fig-hint {
          display: block; margin-top: 5px;
          font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
          color: rgba(171, 191, 210, 0.7);
        }
      }
      .wiki-figure figcaption {
        margin-top: 10px; padding-top: 10px;
        border-top: 1px solid var(--line-2);
        color: rgba(171, 191, 210, 0.95);
        font-size: 13.5px; line-height: 1.6;
        max-width: 48ch;
      }

      /*
       * The prediction prompt. Deliberately louder than the caption: it is
       * the only line on the page that asks the reader to do something
       * before reading on, and a figure they have committed an answer to is
       * a figure they will remember.
       */
      .wiki-fig-ask {
        display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
        margin-top: 12px; padding: 11px 14px;
        border-radius: 4px;
        background: rgba(255, 212, 92, 0.09);
        box-shadow: inset 0 0 0 1px rgba(255, 212, 92, 0.28);
        color: rgba(247, 236, 208, 0.95);
        font-size: 13.5px; line-height: 1.5;
      }
      .wiki-fig-ask-tag {
        flex: 0 0 auto;
        font-size: 9.5px; font-weight: 800; letter-spacing: 0.16em;
        text-transform: uppercase; color: var(--amber);
      }

      .wiki-fig-controls {
        display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 20px;
        margin-top: 10px; padding-top: 12px;
        border-top: 1px solid var(--line-2);
      }
      .wiki-ctl {
        display: flex; flex-direction: column; gap: 5px;
        flex: 1 1 150px; max-width: 240px; min-width: 128px;
      }
      .wiki-ctl.is-toggle, .wiki-ctl-is-pick { flex: 0 0 auto; max-width: none; }
      .wiki-ctl-head {
        display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
      }
      .wiki-ctl-label {
        font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--slate); white-space: nowrap;
      }
      .wiki-ctl-value {
        font-family: var(--mono); font-size: 12.5px; font-weight: 700;
        color: var(--amber); white-space: nowrap;
      }
      .wiki-ctl-value.is-on { color: var(--mint); }

      .wiki-ctl-range {
        appearance: none; -webkit-appearance: none;
        width: 100%; height: 18px; background: transparent; cursor: pointer; margin: 0;
      }
      .wiki-ctl-range::-webkit-slider-runnable-track {
        height: 3px; border-radius: 2px; background: rgba(244, 236, 214, 0.16);
      }
      .wiki-ctl-range::-moz-range-track {
        height: 3px; border-radius: 2px; background: rgba(244, 236, 214, 0.16);
      }
      .wiki-ctl-range::-webkit-slider-thumb {
        appearance: none; -webkit-appearance: none;
        width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%;
        background: var(--sakura); border: 0; cursor: grab;
        box-shadow: 0 0 0 3px rgba(232, 168, 184, 0.16);
      }
      .wiki-ctl-range::-moz-range-thumb {
        width: 14px; height: 14px; border-radius: 50%;
        background: var(--sakura); border: 0; cursor: grab;
        box-shadow: 0 0 0 3px rgba(232, 168, 184, 0.16);
      }
      .wiki-ctl-range:focus-visible { outline: 2px solid var(--sakura); outline-offset: 4px; }

      .wiki-ctl-check {
        appearance: none; -webkit-appearance: none;
        width: 38px; height: 20px; margin: 0; border-radius: 10px; cursor: pointer;
        background: rgba(244, 236, 214, 0.14);
        box-shadow: inset 0 0 0 1px var(--line-2);
        position: relative; transition: background 0.16s var(--ease);
      }
      .wiki-ctl-check::after {
        content: ''; position: absolute; top: 3px; left: 3px;
        width: 14px; height: 14px; border-radius: 50%;
        background: var(--slate); transition: transform 0.16s var(--ease), background 0.16s var(--ease);
      }
      .wiki-ctl-check:checked { background: rgba(125, 255, 180, 0.22); }
      .wiki-ctl-check:checked::after { transform: translateX(18px); background: var(--mint); }

      .wiki-ctl-picks { display: flex; flex-wrap: wrap; gap: 4px; }
      .wiki-ctl-pick {
        appearance: none; border: 0; border-radius: 3px; cursor: pointer;
        background: rgba(16, 22, 17, 0.7); color: rgba(238, 232, 216, 0.72);
        font: inherit; font-size: 11.5px; font-weight: 650; padding: 5px 10px;
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.12);
      }
      .wiki-ctl-pick:hover { color: var(--cream); }
      .wiki-ctl-pick.on {
        color: var(--ink); background: var(--sakura); box-shadow: none;
      }
      .wiki-fig-play {
        margin-left: auto; appearance: none; border: 0; border-radius: 3px;
        background: rgba(16, 22, 17, 0.7); color: var(--slate);
        font: inherit; font-size: 11.5px; font-weight: 650; padding: 6px 12px;
        cursor: pointer; box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.12);
      }
      .wiki-fig-play:hover { color: var(--cream); }

      /* ---- Sections ---- */

      .wiki-pair {
        display: grid; grid-template-columns: 1fr 1fr; gap: 26px;
        margin-bottom: 20px;
        max-width: 900px;
      }
      /*
       * These were rgba(16, 22, 17, 0.5) painted over a page that is already
       * rgb(16, 22, 17), which composites to exactly itself. The two voices
       * the split exists to separate were invisible, and the site's own
       * "how to read this wiki" figure drew the coloured rules that the
       * stylesheet had never actually shipped. It ships them now.
       */
      .wiki-col {
        padding: 16px 20px 10px;
        border-radius: 4px;
        background: rgba(244, 236, 214, 0.035);
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.08);
        border-left: 3px solid transparent;
      }
      .wiki-col-air { border-left-color: rgba(125, 255, 180, 0.55); }
      .wiki-col-lab { border-left-color: rgba(255, 212, 92, 0.5); }
      .wiki-col h3, .wiki-sec h3 {
        margin: 0 0 9px; font-size: 11px; font-weight: 700;
        letter-spacing: 0.16em; text-transform: uppercase;
      }
      .wiki-col-air h3 { color: var(--mint); }
      .wiki-col-lab h3 { color: var(--amber); }
      .wiki-sec h3 { color: var(--sakura); }
      .wiki-article p {
        margin: 0 0 13px;
        color: rgba(238, 233, 218, 0.9);
        font-size: 16px;
        line-height: 1.65;
        /* ch is the width of a zero, which for this stack is about 1.3 real
           characters, so this caps a full width paragraph near 68. */
        max-width: 52ch;
      }
      .wiki-sec {
        margin: 0 0 16px; padding: 14px 20px 5px; border-radius: 4px;
        background: rgba(244, 236, 214, 0.022); max-width: 900px;
        border-left: 3px solid transparent;
      }
      .wiki-sec-sim { border-left-color: rgba(232, 168, 184, 0.55); }
      .wiki-reason { color: var(--slate) !important; font-size: 13px !important; }

      .wiki-chip {
        display: inline-block; padding: 2px 8px; border-radius: 999px;
        font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
      }
      .wiki-chip-live { background: rgba(125, 255, 180, 0.18); color: var(--mint); }
      .wiki-chip-gated { background: rgba(255, 212, 92, 0.18); color: var(--amber); }
      .wiki-chip-applied-inert { background: rgba(157, 179, 200, 0.18); color: var(--slate); }
      .wiki-chip-inert { background: rgba(157, 179, 200, 0.1); color: var(--slate); }
      .wiki-chip-absent { background: rgba(232, 168, 184, 0.12); color: var(--sakura); }

      .wiki-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0; }
      .wiki-filter-label {
        font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--slate); margin-right: 4px;
      }
      .wiki-filter {
        display: inline-flex; align-items: center; gap: 6px;
        appearance: none; border: 0; border-radius: 3px;
        background: rgba(16, 22, 17, 0.7); color: rgba(238, 232, 216, 0.72);
        font: inherit; font-size: 12px; font-weight: 650;
        letter-spacing: 0.04em; padding: 5px 10px; cursor: pointer;
        box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.13);
      }
      .wiki-filter:hover { color: var(--cream); }
      .wiki-filter.on {
        color: var(--cream); box-shadow: inset 0 0 0 1px var(--sakura);
        background: rgba(232, 168, 184, 0.16);
      }
      .wiki-filter-n { font-family: var(--mono); font-size: 11px; color: var(--slate); }
      .wiki-filter.on .wiki-filter-n { color: var(--sakura); }
      .wiki-cli-list { display: flex; flex-direction: column; gap: 3px; margin-bottom: 16px; }

      .wiki-related { margin: 24px 0 8px; }
      .wiki-related-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .wiki-related-link, .wiki-fc-link {
        appearance: none; border: 0; border-radius: 3px;
        background: rgba(232, 168, 184, 0.14); color: var(--cream);
        font: inherit; font-size: 13px; font-weight: 650;
        padding: 8px 13px; cursor: pointer; text-decoration: none;
        display: inline-block;
      }
      .wiki-fc-link { background: var(--mint); color: var(--deep); margin: 8px 0 12px; }
      .wiki-fc-link:hover { background: #9dffc7; color: var(--deep); }
      .wiki-related-link:hover { background: rgba(232, 168, 184, 0.28); }
      .wiki-source {
        color: rgba(157, 179, 200, 0.7) !important; font-size: 12px !important;
        font-family: var(--mono);
      }

      .wiki-journey-nav {
        display: flex; flex-wrap: wrap; gap: 10px;
        margin: 26px 0 8px; padding-top: 18px;
        border-top: 1px solid var(--line-2);
      }
      .wiki-journey-link {
        display: flex; flex-direction: column; gap: 3px;
        appearance: none; border: 0; border-radius: 4px;
        background: rgba(16, 22, 17, 0.55); color: var(--cream);
        box-shadow: inset 0 0 0 1px var(--line-2);
        font: inherit; text-align: left; padding: 11px 15px; cursor: pointer;
        min-width: 12em;
      }
      .wiki-journey-link:hover { background: rgba(232, 168, 184, 0.12); }
      .wiki-journey-link.is-next { margin-left: auto; text-align: right; }
      .wiki-journey-dir {
        font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--sakura);
      }
      .wiki-journey-title { font-size: 14px; font-weight: 650; }

      /* ---- Narrow ---- */

      @media (max-width: 1000px) {
        .wiki-pair { grid-template-columns: 1fr; }
      }

      /*
       * Below 900 px the rail is a drawer rather than a band across the top
       * of the screen. A phone should open on the article, not on a list of
       * links it did not ask for.
       */
      @media (max-width: 900px) {
        .wiki-shell { grid-template-columns: minmax(0, 1fr); }
        .wiki-rail {
          position: fixed; z-index: 25;
          top: 0; bottom: 0; left: 0; width: min(20em, 86vw);
          padding: 22px 16px 40px;
          background: #101710;
          border-right: 1px solid var(--line);
          box-shadow: 12px 0 40px rgba(0, 0, 0, 0.5);
          transform: translateX(-102%);
          transition: transform 0.24s var(--ease);
          visibility: hidden;
        }
        .rail-open .wiki-rail { transform: translateX(0); visibility: visible; }
        .wiki-rail-toggle {
          display: inline-flex; align-items: center; gap: 7px;
          flex: 0 0 auto; appearance: none; border: 0; border-radius: 4px;
          background: rgba(16, 22, 17, 0.8); color: var(--cream);
          box-shadow: inset 0 0 0 1px rgba(244, 236, 214, 0.16);
          font: inherit; font-size: 12.5px; font-weight: 650;
          padding: 10px 13px; cursor: pointer;
        }
        .wiki-rail-toggle::before {
          content: ''; width: 13px; height: 9px;
          border-top: 2px solid var(--sakura);
          border-bottom: 2px solid var(--sakura);
          box-shadow: inset 0 3.5px 0 -1px var(--sakura);
        }
        .wiki-main { padding: 12px var(--gutter) 40px; }
        .wiki-search-hint { display: none; }
        .wiki-figure { padding: 12px 12px 10px; }
        .wiki-ctl { max-width: none; flex-basis: 100%; }
        .wiki-fig-play { margin-left: 0; }
        .wiki-journey-link.is-next { margin-left: 0; }
        .wiki-journey-link { flex: 1 1 100%; }
      }

      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 26px;
        align-items: center;
        justify-content: space-between;
        padding: 10px var(--gutter) 12px;
        border-top: 1px solid var(--line-2);
        font-size: 11.5px;
        letter-spacing: 0.03em;
        color: rgba(157, 179, 200, 0.62);
        background: rgba(12, 18, 14, 0.92);
      }
      footer a { color: rgba(243, 234, 212, 0.78); text-decoration: none; }
      footer a:hover { color: var(--sakura); }
      .foot-links { display: flex; flex-wrap: wrap; gap: 18px; }
      @media (max-width: 620px) {
        footer { font-size: 11px; padding: 8px var(--gutter) 10px; }
        .foot-note { display: none; }
      }

      /*
       * Reduced motion. This block and REDUCED in src/wiki/anim.js are the
       * two places that have to agree. Figures stop moving; they do not stop
       * meaning anything, because every one of them keeps its controls and
       * holds a frame chosen to be the informative one.
       */
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .wiki-main { scroll-behavior: auto; }
        .wiki-rail, .wiki-progress-fill, .wiki-rail-link,
        .wiki-ctl-check, .wiki-ctl-check::after {
          transition: none !important;
        }
      }
    </style>
  </head>
